generate_image_task:
  description: >
    Review the following image prompt and caption context:
    - Image Prompt: {image_prompt}
    - Caption Context: {caption}
    
    Refine the image prompt to ensure it is concrete, brand-safe, and highly visual.
    Return ONLY a valid JSON object with no markdown code fences:
    {"prompt_used": "your final refined prompt here"}
  expected_output: >
    A valid JSON object with one key: "prompt_used". No markdown, no explanation.
  agent: art_director